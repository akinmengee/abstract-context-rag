# Runtime configuration for the RAG engine.
# Every value can be overridden with environment variables:
#   ACR_LLM__MODEL=qwen3-8b  ->  llm.model
# A different file can be pointed at with ACR_CONFIG_FILE.

llm:
  # Ollama exposes an OpenAI-compatible API (chosen over a raw llama.cpp server
  # for ease of setup; still llama.cpp/ggml underneath).
  # Docker -> host: http://host.docker.internal:11434/v1
  # 127.0.0.1, not localhost: Ollama binds IPv4 only, and Windows can resolve
  # "localhost" to the IPv6 loopback (::1) first, which nothing is listening on.
  base_url: "http://127.0.0.1:11434/v1"
  # Qwen3-4B-Instruct-2507 from models/, with its own (non-thinking) template
  # and num_ctx baked in. Create it once with
  #   ollama create qwen3:4b-instruct-8k -f backend/ollama/qwen3-4b-instruct-8k.Modelfile
  # Not `ollama pull qwen3:4b`: that tag is the thinking-only 2507 model, which
  # no request flag switches off (measured ~3000 reasoning tokens, ~57s, for a
  # one-word reply; the instruct model answers the same prompt in 0.5s).
  model: "qwen3:4b-instruct-8k"
  # Must match the Modelfile's num_ctx: the client warns when a prompt fills it,
  # because Ollama truncates silently. 8192 fits a multi-hop context (up to 8
  # chunks) and summary verification; measured 4.2 GB VRAM on the 6 GB card.
  ctx_size: 8192
  temperature: 0.1
  # Prompt and output share ctx_size in Ollama. Answers are a few sentences.
  max_tokens: 1024
  timeout_seconds: 240

embedding:
  model: "BAAI/bge-m3"
  # embed -> rerank -> LLM run sequentially within one request, never at the
  # same time, so there is no real VRAM contention to avoid. On CPU this model
  # was the actual bottleneck (measured: reranking 37 candidates took 104s on
  # CPU); GPU + fp16 (applied automatically for any non-"cpu" device) fixes it.
  device: "cuda"
  batch_size: 8
  max_length: 1024
  dense_size: 1024

reranker:
  model: "BAAI/bge-reranker-v2-m3"
  device: "cuda"
  enabled: true

verification:
  # Checks every claim in an answer against the passage it cited, in one extra
  # LLM call. Costs ~20-60s per answered question; ACR_VERIFICATION__ENABLED=false
  # turns it off while working on something else.
  enabled: true
  # Own budget, larger than an answer's: one verdict line per claim, and a
  # summary can have many claims.
  judge_max_tokens: 2048
  # Passages + claims per judge call. A summary cites whole sections; sending
  # all of them at once overflowed the context and Ollama cut the instructions
  # off (0/22 readable verdicts). Claims are batched to fit instead.
  max_prompt_chars: 20000

agent:
  # off | corrective | multi_hop. Measured on 30 golden questions over three
  # papers (docs/roadmap.md, phase 4): multi_hop raised accuracy 0.83 -> 0.90
  # and multi-hop questions 0.00 -> 0.75, at ~44s instead of ~18s per question,
  # with comparisons dropping 1.00 -> 0.50. corrective alone changed nothing.
  mode: "multi_hop"
  max_rewrites: 1
  max_searches: 3
  max_context_chunks: 8

summarization:
  # One LLM call per group; raising this means fewer, larger calls.
  max_group_chars: 6000
  # map_reduce: summarise every section per question. raptor: reduce the
  # document's precomputed tree nodes - no map calls, but not question-aware.
  # Measured on 12 global questions (docs/roadmap.md, phase 5): raptor 12/12
  # correct at ~32s vs map_reduce 11/12 at ~103s, supported claims 0.78 vs 0.76.
  method: "raptor"

raptor:
  # A summary tree per document (rag.md 7.9.1): cluster chunks, summarise each
  # cluster, repeat on the summaries. One LLM call per cluster, paid once.
  cluster_size: 5
  max_levels: 3
  # On because summarization.method is raptor: a document without a tree falls
  # back to map-reduce. Costs ~60-95s per paper at ingest (measured, 6 papers).
  build_on_ingest: true

qdrant:
  url: "http://localhost:6333"
  collection: "documents"

chunking:
  # Section-aware chunking: blocks are grouped per section, then split by size.
  target_chars: 1800
  overlap_chars: 200
  min_chunk_chars: 200

retrieval:
  mode: "hybrid" # dense | sparse | hybrid
  # Stage 1 casts a wide net (recall), stage 2 reranks down to the context (precision).
  candidates: 50
  context_size: 5
  rrf_k: 60
  # Below this reranker score the question is answered with an abstain instead of the LLM.
  # Measured on the golden set (2026-09-20, 11 questions): correctly-answerable
  # questions scored as low as 0.16, incorrectly-abstained ones scored up to 0.09 -
  # 0.3 was rejecting a correct retrieval. Revisit once the golden set grows past
  # one paper; this gap is narrow on 11 samples.
  score_threshold: 0.12
  # RAPTOR variant (b): let answer() retrieve tree summary nodes next to chunks.
  # Off: retrieval sees the documents' own chunks only. Measured: global
  # questions already reach the tree through summarize(), and visible nodes cost
  # specific questions recall@5 0.96 -> 0.92 and MRR 0.85 -> 0.74.
  include_tree_nodes: false

ingestion:
  # Downloaded PDFs and parser output land here (gitignored).
  storage_dir: "data/documents"
  user_agent: "abstract-context-rag/0.1 (https://github.com/akinmengee/abstract-context-rag)"
