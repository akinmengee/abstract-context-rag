# Runtime configuration for the RAG engine.
# Every value can be overridden with environment variables:
#   ACR_LLM__MODEL=qwen3-8b  ->  llm.model
# A different file can be pointed at with ACR_CONFIG_FILE.

llm:
  # Ollama exposes an OpenAI-compatible API (chosen over a raw llama.cpp server
  # for ease of setup; still llama.cpp/ggml underneath). Model pulled via
  # `ollama pull qwen3:4b` - not our own GGUF import, so the chat template is
  # the one Ollama curates, not auto-detected from the raw file.
  # Docker -> host: http://host.docker.internal:11434/v1
  # 127.0.0.1, not localhost: Ollama binds IPv4 only, and Windows can resolve
  # "localhost" to the IPv6 loopback (::1) first, which nothing is listening on.
  base_url: "http://127.0.0.1:11434/v1"
  model: "qwen3:4b"
  # Start small; raise only when map-reduce / RAPTOR needs more context (6 GB VRAM budget).
  ctx_size: 4096
  temperature: 0.1
  # Qwen3 "thinks" before answering (separate `reasoning` field we never read).
  # `think: false` (llm_client.py) shortens it but does not eliminate it, and a
  # real question with real retrieved context thinks far longer than a trivial
  # test prompt - budget generously so content never gets starved.
  max_tokens: 4096
  timeout_seconds: 240

embedding:
  model: "BAAI/bge-m3"
  # embed -> rerank -> LLM run sequentially within one request, never at the
  # same time, so there is no real VRAM contention to avoid. On CPU this model
  # was the actual bottleneck (measured: reranking 37 candidates took 104s on
  # CPU); GPU + fp16 (applied automatically for any non-"cpu" device) fixes it.
  device: "cuda"
  batch_size: 8
  max_length: 1024
  dense_size: 1024

reranker:
  model: "BAAI/bge-reranker-v2-m3"
  device: "cuda"
  enabled: true

verification:
  # Checks every claim in an answer against the passage it cited, in one extra
  # LLM call. Costs ~20-60s per answered question; ACR_VERIFICATION__ENABLED=false
  # turns it off while working on something else.
  enabled: true

summarization:
  # One LLM call per group; raising this means fewer, larger calls.
  max_group_chars: 6000

qdrant:
  url: "http://localhost:6333"
  collection: "documents"

chunking:
  # Section-aware chunking: blocks are grouped per section, then split by size.
  target_chars: 1800
  overlap_chars: 200
  min_chunk_chars: 200

retrieval:
  mode: "hybrid" # dense | sparse | hybrid
  # Stage 1 casts a wide net (recall), stage 2 reranks down to the context (precision).
  candidates: 50
  context_size: 5
  rrf_k: 60
  # Below this reranker score the question is answered with an abstain instead of the LLM.
  # Measured on the golden set (2026-09-20, 11 questions): correctly-answerable
  # questions scored as low as 0.16, incorrectly-abstained ones scored up to 0.09 -
  # 0.3 was rejecting a correct retrieval. Revisit once the golden set grows past
  # one paper; this gap is narrow on 11 samples.
  score_threshold: 0.12

ingestion:
  # Downloaded PDFs and parser output land here (gitignored).
  storage_dir: "data/documents"
  user_agent: "abstract-context-rag/0.1 (https://github.com/akinmengee/abstract-context-rag)"
