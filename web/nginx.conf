# Serves the built SPA and reverse-proxies /api/ to the backend container, so
# the browser only ever talks to one origin - no CORS, no baked-in backend
# URL, works unchanged on any host/IP/domain this is deployed to.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses the History API - a direct load of /chat/<id> has no
    # matching file, so fall back to index.html and let the client router
    # handle it.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # /chat/stream is Server-Sent Events - buffering here would collect
        # the whole response before sending it on, defeating streaming.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # nginx's 60s default read timeout is shorter than a real answer
        # can take here: multi-hop generation alone measured 90-150s on a
        # cold GPU cache, and ingesting a new document (RAPTOR tree
        # building) can run past that too - both go through this same
        # proxy. Matches this backend's own llm.timeout_seconds (240s) with
        # headroom for slower cases instead of nginx cutting in first.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
