# Development runs Qdrant, the backend and the dev UI in Docker, while llama.cpp
# stays on the host: giving a container the GPU costs extra overhead, and 6 GB of
# VRAM has none to spare. `--profile gpu` moves llama.cpp into Docker for a final,
# single-command demo.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ACR_QDRANT__URL: http://qdrant:6333
      # The host's llama.cpp server, reachable through the gateway below.
      ACR_LLM__BASE_URL: http://host.docker.internal:8080/v1
      ACR_INGESTION__STORAGE_DIR: /data/documents
      # Model caches are large; keep them on a volume instead of in the image.
      HF_HOME: /data/huggingface
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant

  ui:
    build: ./ui
    ports:
      - "7860:7860"
    environment:
      ACR_API_URL: http://backend:8000
    depends_on:
      - backend

  llm:
    profiles: ["gpu"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command: >
      -m /models/${LLM_MODEL_FILE:-Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLM_CTX_SIZE:-8192}
      -ngl 99
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
